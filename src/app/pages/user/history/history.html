<section class="container px-4 py-4 max-w-lg mx-auto mt-8 pb-12">
  <header class="flex items-center justify-between mb-6">
    <h1 class="text-xl font-bold text-text1 flex items-center gap-2">
      <lucide-icon
        [img]="CalendarIcon"
        [strokeWidth]="2"
        size="24"
        class="text-primary"
      ></lucide-icon>
      Mi Historial
    </h1>
  </header>

  <app-training-history-calendar
    [days]="calendarDays()"
    [year]="currentYear()"
    [month]="currentMonth()"
    [selectedDate]="selectedDate()"
    [loading]="loading()"
    [error]="error()"
    (daySelected)="onDayClick($event)"
    (previousMonth)="prevMonth()"
    (nextMonth)="nextMonth()"
    (reload)="reloadMonth()"
  ></app-training-history-calendar>

  <app-training-history-day-preview
    [preview]="preview()"
    [loading]="previewLoading()"
    [error]="previewError()"
    (retry)="retryPreview()"
  ></app-training-history-day-preview>
</section>
