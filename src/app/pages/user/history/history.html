<section class="container px-4 py-4 max-w-lg mx-auto mt-8 pb-12">
  <header class="flex items-center justify-between mb-6">
    <h1 class="text-xl font-bold text-text1 flex items-center gap-2">
      <lucide-icon
        [img]="CalendarIcon"
        [strokeWidth]="2"
        size="24"
        class="text-primary"
      ></lucide-icon>
      Mi Historial
    </h1>

    <div class="flex items-center gap-3">
      <button
        class="p-2 rounded-full hover:bg-white/10 text-text2 transition-colors"
        (click)="prevMonth()"
        aria-label="Mes anterior"
      >
        <lucide-icon [img]="ChevronLeftIcon" [strokeWidth]="2" size="20"></lucide-icon>
      </button>
      <span class="text-sm font-semibold text-text1 min-w-[140px] text-center">
        {{ currentMonthName() }} {{ currentYear() }}
      </span>
      <button
        class="p-2 rounded-full hover:bg-white/10 text-text2 transition-colors"
        (click)="nextMonth()"
        aria-label="Mes siguiente"
      >
        <lucide-icon [img]="ChevronRightIcon" [strokeWidth]="2" size="20"></lucide-icon>
      </button>
    </div>
  </header>

  <section class="bg-background2 border-2 border-background4 rounded-2xl p-4">
    <!-- Weekday labels -->
    <nav class="grid grid-cols-7 mb-2" aria-label="Días de la semana">
      @for (day of weekDays; track day) {
        <div
          class="text-center text-xs font-semibold text-text3/60 uppercase tracking-wider py-1 rounded-2xl"
        >
          {{ day }}
        </div>
      }
    </nav>

    <!-- Calendar grid -->
    <div class="grid grid-cols-7" role="grid" aria-label="Calendario">
      @for (day of calendarDays(); track $index) {
        <div [class]="getWrapperClasses(day)">
          <div [class]="getDayClasses(day)">
            {{ day || '' }}
          </div>
        </div>
      }
    </div>

    <!-- Legend -->
    <footer class="flex items-center gap-4 mt-4 pt-3 border-t border-background4">
      <div class="flex items-center gap-2">
        <span class="w-4 h-4 rounded-full border border-accent bg-accent/15"></span>
        <span class="text-xs text-text2">Week-log</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-4 h-4 rounded-full border-2 border-primary"></span>
        <span class="text-xs text-text2">Hoy</span>
      </div>
    </footer>
  </section>
</section>
