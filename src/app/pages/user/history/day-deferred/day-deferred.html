<section class="container px-4 py-4 max-w-lg mx-auto mt-8 pb-12">
  <div class="mb-4">
    <app-text-link
      [text]="'Volver al historial'"
      [routerLink]="'/user/history'"
      [color]="'primary'"
    ></app-text-link>
  </div>

  <header class="mb-6">
    <h1 class="text-xl font-bold text-text1 flex items-center gap-2">
      <lucide-icon
        [img]="CalendarIcon"
        [strokeWidth]="2"
        size="24"
        class="text-primary"
      ></lucide-icon>
      {{ containerType() === 'DEFERRED_DAY_LOG' ? 'Día diferido' : 'Día de semana' }}
    </h1>
    <p class="text-sm text-text2 mt-1">Edita la sesión de entrenamiento del día seleccionado.</p>
  </header>

  @if (loading()) {
    <div class="flex items-center justify-center p-8">
      <div class="h-24 w-24">
        <app-loading></app-loading>
      </div>
    </div>
  } @else if (error()) {
    <div class="bg-red-50 border border-red-200 rounded-lg p-4 text-red-700 text-sm">
      {{ error() }}
    </div>
  } @else if (saveSuccess()) {
    <div
      data-test="save-success"
      class="bg-green-50 border border-green-200 rounded-lg p-4 text-green-700 text-sm"
    >
      Sesión de entrenamiento guardada.
    </div>
  } @else {
    <div class="bg-background rounded-2xl shadow-md p-6">
      <app-workout-session-editor
        [editorContext]="editorContext()"
        [workoutSession]="workoutSession()"
        [exercises]="exercises()"
        [selectedDate]="selectedDate()"
        [extraSessions]="extraSessions()"
        [disciplines]="catalog()"
        (save)="onSave($event)"
        (extraSessionSave)="onExtraSessionSave($event)"
        (extraSessionUpdate)="onExtraSessionUpdate($event)"
        (extraSessionDelete)="onExtraSessionDelete($event)"
        (closeEditor)="onCloseEditor()"
        (completeDay)="onCompleteDay()"
      ></app-workout-session-editor>
    </div>
  }
</section>
