<section class="container px-4 py-4 max-w-lg mx-auto mt-8 pb-12">
  <div class="mb-4">
    <app-text-link
      [text]="'Volver al historial'"
      [routerLink]="'/user/history'"
      [color]="'primary'"
    ></app-text-link>
  </div>

  <header class="mb-6">
    <h1 class="text-xl font-bold text-text1 flex items-center gap-2">
      <lucide-icon
        [img]="CalendarIcon"
        [strokeWidth]="2"
        size="24"
        class="text-primary"
      ></lucide-icon>
      {{ containerType() === 'DEFERRED_DAY_LOG' ? 'Día diferido' : 'Día de semana' }}
    </h1>
    <p class="text-sm text-text2 mt-1">Datos del día seleccionado.</p>
  </header>

  <!-- WorkoutSessionEditor compositado según contexto -->
  <app-workout-session-editor
    [editorContext]="editorContext()"
    (save)="onSave()"
    (closeEditor)="closeDialog()"
    (completeDay)="onCompleteDay()"
  ></app-workout-session-editor>
</section>
