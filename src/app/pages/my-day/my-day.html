<section class="container px-4 py-4 max-w-lg mx-auto mt-8">
  <div class="text-primary bg-background2 py-8 rounded-2xl px-4 flex flex-col gap-2">
    <h1 class="text-4xl font-bold text-center">Tu día de entrenamiento</h1>

    @if (this.loading() || this.activeLoading()) {
      <section
        role="status"
        aria-label="Cargando tu día"
        class="mt-4 w-full flex flex-col gap-4 animate-pulse"
      >
        <div class="bg-background3 rounded-2xl p-6 flex flex-col gap-4">
          <div class="h-6 bg-background2 rounded-md w-1/3"></div>
          <div class="h-4 bg-background2 rounded-md w-2/3"></div>
          <div class="h-12 bg-background2 rounded-xl"></div>
          <div class="h-10 bg-background2 rounded-xl"></div>
        </div>
        <div class="bg-background3 rounded-xl p-4 flex flex-col gap-3">
          <div class="h-4 bg-background2 rounded-md w-1/2"></div>
          <div class="h-16 bg-background2 rounded-lg"></div>
          <div class="h-16 bg-background2 rounded-lg"></div>
          <div class="h-16 bg-background2 rounded-lg"></div>
        </div>
      </section>
    } @else {
      @if (this.dayLog()) {
        <app-tracking-day [dayLog]="this.dayLog()"></app-tracking-day>
      } @else {
        <section
          class="flex flex-col items-center gap-4 mt-4 p-6 bg-transparent border border-white/10 rounded-2xl w-full max-w-sm mx-auto text-center"
          aria-labelledby="no-day-title"
        >
          <h3 id="no-day-title" class="text-lg font-medium text-white/80">
            Todavía no tenés un día activo
          </h3>
          <p class="text-text2 text-xs">
            Empezá tu entrenamiento libre de hoy sin necesidad de un plan.
          </p>

          <app-btn
            [text]="'Iniciar día de entrenamiento'"
            [variant]="'raised'"
            size="md"
            [showIcon]="true"
            [color]="'accent'"
            [isDisabled]="creating()"
            (click)="createDayLog()"
          >
            <app-icon>
              <div class="h-6 w-6">
                @if (creating()) {
                  <app-spinner></app-spinner>
                }
              </div>
            </app-icon>
          </app-btn>
        </section>
      }
    }
  </div>
</section>
