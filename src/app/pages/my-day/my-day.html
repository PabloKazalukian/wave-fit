<section class="container px-4 py-4 max-w-lg mx-auto mt-8">
  <div class="text-primary bg-background2 py-8 rounded-2xl px-4 flex flex-col gap-2">
    <h1 class="text-4xl font-bold text-center">Tu día de entrenamiento</h1>

    @if (this.loading() || !this.dayLog()) {
      <p class="text-text2 text-center text-sm">Cargando tu día...</p>
    } @else {
      @if (this.dayLog()) {
        <app-tracking-day [dayLog]="this.dayLog()"></app-tracking-day>
      } @else {
        <section
          class="flex flex-col items-center gap-4 mt-4 p-6 bg-transparent border border-white/10 rounded-2xl w-full max-w-sm mx-auto text-center"
          aria-labelledby="no-day-title"
        >
          <h3 id="no-day-title" class="text-lg font-medium text-white/80">
            Todavía no tenés un día activo
          </h3>
          <p class="text-text2 text-xs">
            Empezá tu entrenamiento libre de hoy sin necesidad de un plan.
          </p>

          <app-btn
            [text]="'Iniciar día de entrenamiento'"
            [variant]="'raised'"
            size="md"
            [showIcon]="true"
            [color]="'accent'"
            (click)="createDayLog()"
          ></app-btn>
        </section>
      }
    }
  </div>
</section>
