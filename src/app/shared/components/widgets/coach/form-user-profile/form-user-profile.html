<form
  class="flex flex-col gap-5 mt-4 bg-background2 border-2 border-background4 rounded-2xl p-5"
  [formGroup]="profileForm"
  (ngSubmit)="onSubmit()"
>
  <header>
    <h3 class="text-primary text-xl font-bold">Configuración básica</h3>
    <p class="text-text2 text-sm">
      Completá estos datos mínimos para que la IA pueda generar tu plan.
    </p>
  </header>

  @if (saving()) {
    <section
      class="flex flex-col items-center justify-center gap-3 py-10"
      aria-live="polite"
      aria-busy="true"
    >
      <div class="h-12 w-12">
        <app-spinner></app-spinner>
      </div>
      <p class="text-text2 text-lg">Guardando configuración...</p>
    </section>
  } @else if (success()) {
    <section class="flex flex-col items-center justify-center gap-3 py-10" aria-live="polite">
      <p class="text-success text-lg font-semibold">Datos guardados exitosamente.</p>
    </section>
  } @else {
    <div class="flex flex-col sm:flex-row flex-wrap gap-5">
      <app-select
        class="flex-1 min-w-[150px]"
        [label]="'Género'"
        [options]="genderOptions"
        [control]="genderControl"
      ></app-select>
      <app-input
        class="flex-1 min-w-[200px]"
        [label]="'Fecha de nacimiento'"
        [type]="'date'"
        [control]="birthDateControl"
      ></app-input>
      <app-input-number
        class="flex-1 min-w-[150px]"
        [label]="'Altura cm'"
        [control]="heightCmControl"
      ></app-input-number>
      <app-input-number
        class="flex-1 min-w-[150px]"
        [label]="'Peso kg'"
        [control]="weightKgControl"
      ></app-input-number>
    </div>

    <div class="flex flex-col sm:flex-row flex-wrap gap-5">
      <app-select
        class="flex-1 min-w-[200px]"
        [label]="'Objetivo Principal'"
        [options]="primaryGoalOptions"
        [control]="primaryGoalControl"
      ></app-select>
      <app-select
        class="flex-1 min-w-[150px]"
        [label]="'Días / semana:'"
        [options]="daysPerWeekOptions"
        [control]="daysPerWeekControl"
      ></app-select>
      <app-select
        class="flex-1 min-w-[200px]"
        [label]="'Experiencia'"
        [options]="trainingExperienceOptions"
        [control]="trainingExperienceControl"
      ></app-select>
    </div>

    <app-btn
      [text]="'Completar datos'"
      [color]="'primary3'"
      [variant]="'raised'"
      [buttonType]="'submit'"
      [isDisabled]="profileForm.invalid"
    ></app-btn>

    @if (errorMessage()) {
      <p class="text-error text-sm font-semibold" role="alert">{{ errorMessage() }}</p>
    }
  }
</form>
