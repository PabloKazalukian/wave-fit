<div class="flex flex-col gap-3 w-full lg:flex-row lg:items-end lg:flex-wrap">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:gap-4">
    <app-input-date
      class="w-full sm:w-40"
      label="Desde"
      [control]="form.controls.from"
      [isDisabled]="isDisabled()"
    />
    <app-input-date
      class="w-full sm:w-40"
      label="Hasta"
      [control]="form.controls.to"
      [isDisabled]="isDisabled()"
    />
  </div>

  <div class="flex flex-wrap gap-2 lg:ml-auto">
    @for (preset of presets(); track preset.days) {
      <app-btn
        class="w-auto px-3"
        [text]="preset.label"
        [size]="'sm'"
        [variant]="isPresetActive(preset) ? 'raised' : 'outline'"
        [isDisabled]="isDisabled()"
        [dataTest]="'preset-' + preset.days"
        (click)="applyPreset(preset)"
      />
    }
  </div>

  @if (invalidMessage() !== null) {
    <p class="text-error text-xs lg:w-full" role="alert">{{ invalidMessage() }}</p>
  }
</div>
