<section class="bg-background2 rounded-2xl p-5 w-full flex flex-col gap-4">
  <header class="flex flex-col gap-1">
    <h2 class="text-xl font-bold text-primary">{{ title() }}</h2>
    @if (computedAt()) {
      <p class="text-xs text-text2">Actualizado el {{ formatDateTime(computedAt()!) }}</p>
    }
  </header>

  @if (loading()) {
    <div class="animate-pulse" aria-busy="true" aria-label="Cargando estadísticas">
      <div class="h-48 bg-background3 rounded-2xl w-full"></div>
    </div>
  } @else if (error()) {
    <div
      class="bg-error/10 border border-error/20 rounded-xl p-4 flex flex-col items-center gap-3 text-center"
      role="alert"
    >
      <p class="text-sm text-text2 leading-relaxed">{{ error() }}</p>
      <app-btn
        [text]="'Reintentar'"
        [color]="'primary'"
        [variant]="'outline'"
        [size]="'sm'"
        (click)="retry.emit()"
      ></app-btn>
    </div>
  } @else if (empty()) {
    <div class="flex flex-col items-center gap-2 text-center py-6">
      <p class="text-sm text-text2 leading-relaxed">{{ emptyMessage() }}</p>
    </div>
  } @else {
    <ng-content />
  }
</section>
