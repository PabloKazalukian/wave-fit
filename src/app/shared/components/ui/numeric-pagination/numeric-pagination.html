<div class="flex flex-col gap-2">
  @if (total() > 0) {
    <p class="text-text2 text-xs text-center">
      Mostrando {{ startIndex() }} - {{ endIndex() }} de {{ total() }}
    </p>
  }

  <div class="flex items-center justify-center gap-2">
    <button
      (click)="goToPage(currentPage() - 1)"
      [disabled]="!hasPreviousPage()"
      [attr.aria-label]="'Página anterior'"
      class="p-2 rounded-lg border border-background4 bg-background2 text-text2 hover:bg-background3 disabled:opacity-30 disabled:cursor-not-allowed transition-all"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-4 h-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    @for (page of visiblePages(); track page) {
      <button
        (click)="goToPage(page)"
        class="w-9 h-9 rounded-lg border border-background4 transition-all"
        [class.bg-primary]="page === currentPage()"
        [class.text-background]="page === currentPage()"
        [class.font-bold]="page === currentPage()"
        [class.bg-background2]="page !== currentPage()"
        [class.text-text2]="page !== currentPage()"
        [class.hover:bg-background3]="page !== currentPage()"
      >
        {{ page }}
      </button>
    }

    <button
      (click)="goToPage(currentPage() + 1)"
      [disabled]="!hasNextPage()"
      [attr.aria-label]="'Página siguiente'"
      class="p-2 rounded-lg border border-background4 bg-background2 text-text2 hover:bg-background3 disabled:opacity-30 disabled:cursor-not-allowed transition-all"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-4 h-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>
</div>
